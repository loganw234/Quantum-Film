[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-film"
version = "0.1.0"
description = "Film stocks whose crystal fields are laid by quantum processes, and a fixer that makes every print of a roll identical everywhere."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Logan W." }]
dependencies = ["numpy>=2.0", "mpmath>=1.3"]

[project.optional-dependencies]
test = ["pytest", "ruff"]
# Development borrows atlas-film's sourced organs from the git submodule
# vendor/atlas-film, pinned at d4007b2 (its pinned branch). quantum_film.develop
# imports it from there and refuses any other copy, so no extra installs it.
# The tools that render images (first_prints, print_figures, poster) need these:
media = ["pillow", "matplotlib"]
# The hardware tools (round 3: tools/hw_bundle.py, hw_run.py, hw_predict.py) need these, pinned to the
# versions measured in docs/HARDWARE.md, in a virtualenv of their own: never the main environment.
ibm = ["qiskit==2.5.2", "qiskit-ibm-runtime==0.50.0", "qiskit-aer==0.17.2"]

# Discovered, not listed: a parcel that adds a subpackage edits nothing here
# (ParcelRound METHOD 2: aim for a glob, not a list).
[tool.setuptools.packages.find]
include = ["quantum_film*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gates must not depend on whatever plugins happen to be installed: on the
# owner's desktop, zarr's pytest plugin imports CuPy and prints a CUDA warning
# into every log (2026-09-25). verify/pytest-stage.sh also sets
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1, which covers every other third-party plugin.
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
